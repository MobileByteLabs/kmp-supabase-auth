# PR Check Workflow — fast gate on pull requests
# Runs quality + JVM tests on changed modules only (iOS/Linux skipped for speed).
# Full build (all modules) runs on push to dev via gradle.yml.
# Native test EXECUTION is nightly / opt-in — see native-tests.yml.

name: PR Check

on:
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-check:
    uses: MobileByteLabs/mbl-actionhub/.github/workflows/ci-kmp-library.yml@v1.9.1
    with:
      # This repo publishes cmp-supabase-auth + cmp-supabase-auth-compose. `sample-app` is outside the
      # pattern — samples are proof, not artifacts, and must never reach Maven Central.
      module-pattern: 'cmp-'
      java-version: '21'
      java-distribution: 'zulu'
      run-quality: true
      run-ios-tests: false
      run-linux-tests: false

  # ── Docs gate ────────────────────────────────────────────────────────────────────────────
  # Pure text gate, so it runs in seconds and needs neither Gradle nor a JDK.
  #
  # kmp-toolkit pairs this with assert-observability-wired.sh. That gate is NOT ported here: it
  # presupposes a cmp-observe dependency, whose published jvm artifact is compiled at Java 21
  # (class file 65). Taking it would force JDK 21 on every desktop consumer of cmp-supabase-auth, which
  # is too high a price for lifecycle hooks. Revisit if cmp-observe ships a lower-target jvm jar.
  # Its own job, not a step in Docs Gate: that job is checkout-only with a 5-minute budget, so a
  # Gradle task there has no JDK, no Gradle cache, and gets CANCELLED on timeout — which is how
  # this gate failed to actually run on PR #15 while showing a red X and an empty log.
  publish-config:
    name: Publish task configures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      # Configures the REAL publish task under the SAME condition CI uses: the publish workflow
      # appends these three properties to gradle.properties before invoking Gradle. `./gradlew
      # build` never configures the publish task, so a publish-only configuration error stays
      # invisible until a release is cut — v0.1.0 and v0.1.1 both failed that way while every
      # other check was green. --dry-run configures without uploading, so it needs no credentials.
      - name: Publish task configures (release dry-run)
        run: |
          ./gradlew publishAllPublicationsToMavenCentralRepository --dry-run \
            -PSONATYPE_HOST=CENTRAL_PORTAL \
            -PSONATYPE_AUTOMATIC_RELEASE=true \
            -PVERSION_NAME="$(grep -E '^supabaseauth\.version=' gradle.properties | cut -d= -f2)"

  # ── Docs: ONE job for every docs check a PR needs ────────────────────────────────────────────
  # Previously FOUR separate PR entries — "Docs Gate" (pr-check), "Docs are current with the build"
  # (docs-refresh), "Assemble site & verify links" (docs-publish), plus two deploy jobs that only
  # ever render as "skipping" on a PR. Four checkouts and four queue waits to answer one question:
  # are the docs correct for this change? They are merged here; the deploy jobs stay where they
  # are, on push, where they belong.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Every module has complete docs with resolving links
        run: bash .github/scripts/assert-docs-complete.sh

      - name: No hardcoded library version in docs
        run: bash .github/scripts/assert-no-hardcoded-version.sh

      # Runs on every PR, not just version bumps: the cheapest moment to write a release note is
      # while the change is still in review. `--since` additionally requires that a change to
      # shippable code (cmp-*/src, the version, the catalog) arrives with a changelog entry, so
      # the release section is written continuously rather than reconstructed from git log at
      # release time. Docs/CI-only PRs are exempt automatically.
      - name: Every shipped version has its changelog section
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          # checkout@v7 is shallow by default, so the base commit is not present until fetched.
          git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null || git fetch --no-tags origin "${{ github.base_ref }}"
          bash .github/scripts/assert-changelog.sh --since "$BASE"

      - name: Generated docs match the build
        run: |
          set -euo pipefail
          chmod +x scripts/docs/*.sh
          if ! bash scripts/docs/refresh.sh --check; then
            {
              echo "### 📚 Docs are out of step with the build"
              echo
              echo "This PR changes module targets, the version, the public API or the version"
              echo "catalog without refreshing the derived documentation. Those blocks are"
              echo "generated from build files, so they cannot be corrected by hand."
              echo
              echo '```bash'
              echo 'bash scripts/docs/refresh.sh'
              echo '```'
              echo
              echo "Prose outside the \`<!-- docs-gen:* -->\` markers is never touched."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ generated docs match the build" >> "$GITHUB_STEP_SUMMARY"

      # Staged with the SAME script the deploy path uses, so a link that resolves here resolves
      # on the published site.
      - name: Assemble site & verify every relative link resolves
        run: |
          set -euo pipefail
          bash .github/scripts/stage-docs-site.sh _site
          python3 .github/scripts/assert-docs-links.py _site

  # ── Kover coverage ───────────────────────────────────────────────────────────────────────
  # Separate job rather than an input to the reusable workflow above: ci-kmp-library.yml exposes
  # no coverage option, and coverage aggregates at the ROOT (KoverConventionPlugin) rather than
  # per module, so it does not fit that workflow's per-module matrix.
  coverage:
    name: Kover Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # Robolectric fetches its android-all image into ~/.m2 on first use and setup-gradle does
      # not cache that path. Keyed on the catalog so a version bump invalidates it rather than
      # silently serving a stale image.
      - name: Cache Robolectric android-all images
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-

      - name: Run tests + Kover XML report
        run: ./gradlew koverXmlReport

      # A REAL gate: `koverLineMin=30` in gradle.properties, set just under the 32.67% measured
      # on 2026-09-27. It was 0 until then, which meant this step could not fail — a green check
      # that verified nothing. Raise the floor as coverage PRs land; never lower it to make a
      # red build pass.
      - name: Verify coverage floor
        run: ./gradlew koverVerify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-report
          path: '**/build/reports/kover/**'
          if-no-files-found: warn

      - name: Coverage summary
        if: always()
        run: bash .github/scripts/kover-summary.sh

  # ── Binary compatibility ─────────────────────────────────────────────────────────────────
  # Both publishable modules carry BCV baselines under api/. A public-API change that is not
  # accompanied by a regenerated baseline fails here — which is the point: the diff in the PR
  # is what makes an accidental breaking change visible to a reviewer.
  api-check:
    name: Binary Compatibility (BCV)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: apiCheck
        run: ./gradlew apiCheck
