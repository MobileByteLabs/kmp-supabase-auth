# Publish Workflow — delegates to mbl-actionhub reusable publish workflow
#
# Triggers:
#   - GitHub release (released or prereleased)
#   - Manual dispatch: workflow_dispatch (optional specific module, optional version override)
#
# `artifact-id` is the ANCHOR artifact for the Maven-Central-ahead sanity check, not the
# full publish set — module-pattern above is what decides which modules publish.
# to match your library's Maven coordinates, then configure these secrets:
#   MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD
#   SIGNING_KEY_ID, SIGNING_PASSWORD, GPG_KEY_CONTENTS

name: Publish

on:
  release:
    types: [released, prereleased]
  workflow_dispatch:
    inputs:
      module:
        description: 'Specific module to publish (leave empty for all cmp-* modules)'
        required: false
        type: string
      version:
        description: 'Override version (leave empty to use build.gradle.kts version)'
        required: false
        type: string

permissions:
  contents: write          # release creation
  pull-requests: write

jobs:
  publish:
    uses: MobileByteLabs/mbl-actionhub/.github/workflows/publish-kmp-library.yml@v1.9.1
    with:
      module-pattern: 'cmp-'
      module: ${{ inputs.module || '' }}
      group-id: 'io.github.mobilebytelabs'
      artifact-id: 'cmp-supabase-auth'
      version: ${{ inputs.version || '' }}
      # WITHOUT THIS the first publish cannot resolve a version at all. The resolver tries, in
      # order: explicit input → gradle-properties-key → GitHub releases → Maven Central. On a
      # library that has never shipped, the last two are empty by definition and the first is
      # blank on an automatic trigger — so leaving this unset failed the `Resolve Version` job
      # with "Could not resolve version from any source", skipping every publish step while the
      # build itself was green.
      #
      # `supabaseauth.version` is this repo's single version SoT (gradle.properties); every
      # module already reads it via providers.gradleProperty(...).
      gradle-properties-key: 'supabaseauth.version'
      verify-against-maven: false           # set true once your library is on Maven Central
      bump-after-release: false
      java-version: '21'
      java-distribution: 'zulu'
      sonatype-host: 'CENTRAL_PORTAL'
      # INVARIANT: every version that reaches Maven Central gets a git tag and a GitHub release.
      # Central is IMMUTABLE — a version published without a tag can never be re-cut, so the
      # default must be "create one", and the single exception must be narrow and explicit.
      #
      # Expressed as `!= 'release'` rather than `== 'workflow_dispatch'` deliberately. The ONLY
      # situation in which creating a release is wrong is when a release is what STARTED this run
      # (the `release:` trigger above) — creating another would duplicate it. Every other entry
      # point, present or future, needs one.
      #
      # The earlier `== 'workflow_dispatch'` form was correct for the two triggers that exist
      # today and silently wrong for any third: a `schedule`, a `repository_dispatch`, a
      # `workflow_call`, or re-enabling publish-trigger.yml's push path would each evaluate FALSE
      # and ship to Central untagged. An allowlist of event names has to be edited in lockstep
      # with every trigger change; a denylist of the one incompatible event does not.
      #
      # History: a literal `false` served only the `release:` path. Observed on v0.2.0 (run
      # 36910691538, dispatched 2026-10-01): both modules reached Central while `gh release list`
      # still ended at v0.1.3. That is the gap this expression closes for good.
      create-github-release: ${{ github.event_name != 'release' }}


    # `inherit`, deliberately. Every credential this workflow needs already exists as an
    # ORGANISATION secret on MobileByteLabs, under exactly these names:
    #   GPG_KEY_CONTENTS · MAVEN_CENTRAL_USERNAME · MAVEN_CENTRAL_PASSWORD
    #   SIGNING_KEY_ID   · SIGNING_PASSWORD       · GRADLE_PUBLISH_{KEY,SECRET}
    # (verify: gh api repos/MobileByteLabs/kmp-supabase-auth/actions/organization-secrets)
    #
    # Do NOT re-add repo-level copies or a rename mapping. A repo secret SHADOWS the org secret
    # of the same name, so a stale copy silently signs releases with the wrong key while every
    # job stays green — which is exactly what an earlier attempt here set up before it was caught.
    secrets: inherit
