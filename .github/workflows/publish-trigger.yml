name: Publish trigger (consumer-library-ai-bridge epic AC #24)

# Auto-trigger publish.yml when the dev branch receives a cmp-*/ change.
# Delegates to mbl-actionhub's publish-on-development-push.yml@v1.8.0+ reusable workflow
# for the debounce + dispatch logic.
#
# Authored 2026-05-30 (Phase 05 T7 of consumer-library-ai-bridge epic).

# DISABLED push trigger — deliberately, not by neglect. But the ORIGINAL reason no longer holds.
#
# It used to read: "every publish must come from a GitHub release, because that is the only path
# that produces a tag … (publish.yml sets `create-github-release: false`: it EXPECTS the release to
# already exist)". That was true when publish.yml hardcoded `false`. It is NOT true any more —
# publish.yml now sets `create-github-release: ${{ github.event_name != 'release' }}`, so ANY entry
# point other than the `release:` trigger creates the tag and the changelog-enriched release
# itself. This workflow dispatches publish.yml, which arrives as `workflow_dispatch`, so a
# push-triggered publish would now be tagged and released like any other.
#
# The push path therefore stays disabled on a POLICY ground, not a safety one: it would publish to
# immutable Maven Central on every merge to dev that touches `cmp-*/**`, making the release cadence
# a side effect of merging rather than a decision. Re-enable it only if that is what you want.
#
# It was also latent rather than safe once: the path filter below said `auth-*/**`, a leftover from
# the cmp-* rename, so it could never match and this workflow never fired. Correcting the glob on
# 2026-09-27 would have ARMED it, and the very next merge to dev touched four matching files.
#
# The paths are kept correct so that re-enabling is a one-line change. To release today: bump
# `supabaseauth.version` + its `## [x.y.z]` CHANGELOG section, then either run publish.yml via
# workflow_dispatch (it tags + releases), or `gh release create vX.Y.Z` and let the `release:`
# trigger run it.
on:
  # push:
  #   branches: [dev]
  #   paths:
  #     - 'cmp-*/**'
  #     - 'libs.versions.toml'
  #     - 'gradle/libs.versions.toml'
  #     - 'gradle.properties'
  workflow_dispatch:

jobs:
  trigger-publish:
    uses: MobileByteLabs/mbl-actionhub/.github/workflows/publish-on-development-push.yml@v1.9.1
    with:
      publish_workflow_name: 'publish.yml'
      debounce_minutes: 30
      target_ref: 'dev'
