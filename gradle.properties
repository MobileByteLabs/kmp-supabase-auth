#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.caching=true
org.gradle.configuration-cache=true
#Kotlin
kotlin.code.style=official
kotlin.js.compiler=ir
#MPP
kotlin.mpp.enableCInteropCommonization=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 compatibility: com.android.application + KMP requires opting out of built-in Kotlin
android.builtInKotlin=false

# ── Library version — SINGLE SOURCE OF TRUTH ────────────────────────────────
# Every publishable module reads this via providers.gradleProperty("supabaseauth.version").
# Never hardcode a version in a module build file.
supabaseauth.version=0.3.1

# Kover coverage floor. 0 until a baseline is agreed — raise to make it a real gate.
koverLineMin=30

# Dokka — opt into the v2 plugin (DokkaExtension + dokkaGenerate tasks). REQUIRED: the
# supabaseauth.dokka convention plugin configures the V2 DokkaExtension and vanniktech's
# JavadocJar.Dokka("dokkaGeneratePublicationHtml") wraps the V2 task. Without this flag the
# extension is never registered and every module applying the convention fails at configuration.
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled

# Publishing, matching kmp-toolkit exactly (its modules publish successfully with these).
#
# The vanniktech plugin derives EVERYTHING from properties: the host from SONATYPE_HOST, the
# version from VERSION_NAME (injected by the publish workflow), the group from `group =` and the
# artifactId from the Gradle project name. The modules therefore call neither coordinates() nor
# publishToMavenCentral() — coordinates() sets the extension's version AFTER VERSION_NAME has
# finalized it, which failed both the v0.1.0 and v0.1.1 publishes with
# "property 'version$gradle_maven_publish_plugin_plugin' is final and cannot be changed".
SONATYPE_HOST=CENTRAL_PORTAL
SONATYPE_AUTOMATIC_RELEASE=true
