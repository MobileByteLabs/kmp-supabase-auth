name: Secret presence probe (temporary)

# TEMPORARY DIAGNOSTIC — delete once the publishing secret wiring is settled.
#
# Answers one question that cannot be answered from a laptop without `admin:org`: which secret
# NAMES actually resolve inside a run on this repo, whether they come from the repo or are
# inherited from the organisation.
#
# It prints PRESENCE ONLY — the length bucket of each value, never the value. GitHub masks
# secrets in logs, but a masked value is still a value that was written; reporting a boolean
# avoids relying on masking at all.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report which publishing secrets resolve
        env:
          # Names the reusable publish workflow requires
          S_MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          S_MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          S_SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          S_GPG_KEY_CONTENTS: ${{ secrets.GPG_KEY_CONTENTS }}
          S_SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          # Alternative names seen on KmpToolkit
          S_GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          S_GPG_FULL_KEY_ID: ${{ secrets.GPG_FULL_KEY_ID }}
          S_GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          S_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          # Names this repo currently carries from the vault sync
          S_CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          S_CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          S_SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          S_FRAMEWORK_GPG_SIGNING_KEY_ID: ${{ secrets.FRAMEWORK_GPG_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          printf '%-34s %-8s %s\n' "SECRET" "PRESENT" "SIZE"
          printf '%-34s %-8s %s\n' "----------------------------------" "--------" "----"
          for v in $(env | grep -oE '^S_[A-Z_]+' | sort); do
            val="${!v}"
            name="${v#S_}"
            if [ -n "$val" ]; then
              printf '%-34s %-8s %s\n' "$name" "yes" "${#val} chars"
            else
              printf '%-34s %-8s %s\n' "$name" "no" "-"
            fi
          done
