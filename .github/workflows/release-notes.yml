# Release Notes — delegates to mbl-actionhub reusable workflow
#
# Fires on release events (and via manual dispatch for backfill) and asks the
# centralized release-notes-from-changelog workflow to prepend the matching
# CHANGELOG.md section as "What's changed" above the publish workflow's
# auto-generated "Published Modules" artifact list.
#
# Source workflow: MobileByteLabs/mbl-actionhub
# Reusable workflow docs:
#   https://github.com/MobileByteLabs/mbl-actionhub#release-notes--release-notes-from-changelogyml

name: Release Notes

on:
  release:
    # NOT `edited`. Enrichment prepends the changelog section above whatever the body currently
    # holds, so firing on `edited` means every manual curation is immediately re-prepended over
    # — the workflow fights the human. Observed while adding "never published" warnings to the
    # v0.1.0/v0.1.1 tags: each edit was clobbered within seconds, repeatedly.
    #
    # Note the workflow checks out AT THE RELEASE TAG, so it reads the CHANGELOG.md frozen in
    # that tag's tree. Correcting a changelog on `dev` cannot change what an older tag enriches
    # with; only editing the release body can, which is precisely what `edited` was undoing.
    #
    # `workflow_dispatch` below remains the way to re-enrich a release deliberately.
    types: [created, published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to enrich (e.g. v3.4.0)'
        required: true
        type: string

jobs:
  enrich:
    uses: MobileByteLabs/mbl-actionhub/.github/workflows/release-notes-from-changelog.yml@v1.9.1
    permissions:
      contents: write
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      # `fail-when-missing` defaults to FALSE upstream, which means a release whose version has no
      # CHANGELOG.md section is enriched with nothing and the job still goes green — the release
      # ships with only the auto-generated artifact list and nobody is told. Every release here
      # must carry its changelog section, so a missing one is an error, not a no-op.
      #
      # The name is `fail-when-missing` — verify against the PINNED ref before changing it:
      #   gh api repos/MobileByteLabs/mbl-actionhub/contents/.github/workflows/\
      #     release-notes-from-changelog.yml?ref=v1.9.1 --jq .content | base64 -d
      # An unknown input makes a reusable workflow fail at STARTUP, which reports as
      # `startup_failure` with no log to read — exactly how v0.1.0 shipped with no release notes.
      fail-when-missing: true
    secrets: inherit
