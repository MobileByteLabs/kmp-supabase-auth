# Publish Workflow — delegates to mbl-actionhub reusable publish workflow
#
# Triggers:
#   - GitHub release (released or prereleased)
#   - Manual dispatch: workflow_dispatch (optional specific module, optional version override)
#
# `artifact-id` is the ANCHOR artifact for the Maven-Central-ahead sanity check, not the
# full publish set — module-pattern above is what decides which modules publish.
# to match your library's Maven coordinates, then configure these secrets:
#   MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD
#   SIGNING_KEY_ID, SIGNING_PASSWORD, GPG_KEY_CONTENTS

name: Publish

on:
  release:
    types: [released, prereleased]
  workflow_dispatch:
    inputs:
      module:
        description: 'Specific module to publish (leave empty for all cmp-* modules)'
        required: false
        type: string
      version:
        description: 'Override version (leave empty to use build.gradle.kts version)'
        required: false
        type: string

permissions:
  contents: write          # release creation
  pull-requests: write

jobs:
  publish:
    uses: MobileByteLabs/mbl-actionhub/.github/workflows/publish-kmp-library.yml@v1.9.1
    with:
      module-pattern: 'cmp-'
      module: ${{ inputs.module || '' }}
      group-id: 'io.github.mobilebytelabs'
      artifact-id: 'cmp-supabase-auth'
      version: ${{ inputs.version || '' }}
      # WITHOUT THIS the first publish cannot resolve a version at all. The resolver tries, in
      # order: explicit input → gradle-properties-key → GitHub releases → Maven Central. On a
      # library that has never shipped, the last two are empty by definition and the first is
      # blank on an automatic trigger — so leaving this unset failed the `Resolve Version` job
      # with "Could not resolve version from any source", skipping every publish step while the
      # build itself was green.
      #
      # `supabaseauth.version` is this repo's single version SoT (gradle.properties); every
      # module already reads it via providers.gradleProperty(...).
      gradle-properties-key: 'supabaseauth.version'
      verify-against-maven: false           # set true once your library is on Maven Central
      bump-after-release: false
      java-version: '21'
      java-distribution: 'zulu'
      sonatype-host: 'CENTRAL_PORTAL'
      create-github-release: false          # release already exists — this workflow is triggered by it

    # EXPLICIT MAPPING, not `secrets: inherit`.
    #
    # The vault's alias registry is the SoT for secret NAMES, and its names differ from what this
    # reusable workflow declares:
    #     framework-maven-central-username -> CENTRAL_PORTAL_USERNAME   (workflow wants MAVEN_CENTRAL_USERNAME)
    #     framework-maven-central-password -> CENTRAL_PORTAL_PASSWORD   (workflow wants MAVEN_CENTRAL_PASSWORD)
    #     framework-gpg-signing-key        -> SIGNING_KEY               (workflow wants GPG_KEY_CONTENTS)
    #     framework-gpg-signing-password   -> SIGNING_PASSWORD          (matches)
    #     framework-gpg-signing-key-id     -> FRAMEWORK_GPG_SIGNING_KEY_ID (workflow wants SIGNING_KEY_ID)
    #
    # The key-id had no vault entry at all — the first publish failed partly on that. It is the
    # last 8 chars of the signing key's long id (vanniktech's `signingInMemoryKeyId`), DERIVED
    # from framework-gpg-signing-key rather than hand-entered, so the two can never disagree.
    #
    # `inherit` passes names through unchanged, so the workflow would read empty strings for
    # three of five and fail deep inside the publish step as if the credentials were wrong.
    # Mapping here keeps ONE copy of each value in the vault and renames only at the boundary.
    secrets:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
      GPG_KEY_CONTENTS:       ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD:       ${{ secrets.SIGNING_PASSWORD }}
      SIGNING_KEY_ID:         ${{ secrets.FRAMEWORK_GPG_SIGNING_KEY_ID }}
      GH_TOKEN:               ${{ secrets.GITHUB_TOKEN }}
